<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="i18n-title" content="results.title">
<title>Results</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23b0302e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Schibsted+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="site.css?v=20261125i">
<link rel="stylesheet" href="app.css?v=20261125i">
<script src="lang/en.js?v=20261125i"></script><script src="lang/de.js?v=20261125i"></script><script src="lang/fr.js?v=20261125i"></script><script src="i18n.js?v=20261125i"></script>
<script src="motion.js?v=20261125i"></script>
<style>
/* One colour per result, used everywhere on the page. */
.tp{--endorsed:var(--good);--contested:#c2410c;--weak:#8a8e94;--needs:#b0760f}
.chip-sample{display:inline-flex;gap:6px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.chip-sample b{color:var(--needs)}
.statsline{margin:10px 0 0;font-size:15px;color:var(--muted)}

/* Summary bar: click a colour to filter */
.summary{display:flex;height:46px;border-radius:12px;overflow:hidden;margin:4px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.summary button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px var(--ui);white-space:nowrap;overflow:hidden;min-width:0;transition:filter .2s ease,opacity .2s ease,flex-grow .8s cubic-bezier(.2,.7,.2,1)}
.summary button:hover{filter:brightness(1.08)}
.summary button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.summary.filtered button:not([aria-pressed="true"]){opacity:.35}
.key{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 6px}
.key button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.key button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.key button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}

/* One card per change, all visible */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:16px 20px;min-width:0}
.card .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12px/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.card .meta{font-size:13.5px;color:var(--muted)}
.card .mine{font:700 10.5px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--pale);border-radius:999px;padding:3px 7px}
.cl-text{font:400 clamp(18px,1.7vw,20px)/1.55 var(--ui);margin:0 0 8px}
.cl-text del{color:var(--muted)}
.cl-text ins{color:var(--accent);text-decoration:none;background:var(--pale);padding:0 2px;border-radius:3px}
.card .why{font-size:15px;color:#555;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .res{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:6px 18px;align-items:center}
.card .line{font-size:14px;color:#333;margin:0}
.div{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:14px;position:relative}
.div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--ink);opacity:.5}
.div .no{justify-self:end;height:100%;background:var(--contested);opacity:.75;border-radius:4px 0 0 4px;transform-origin:right;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.div .yes{justify-self:start;height:100%;background:var(--endorsed);border-radius:0 4px 4px 0;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.pcts{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.pcts b{color:var(--endorsed)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.more-row{display:flex;justify-content:center;margin-top:16px}
.more-row:empty{display:none}

/* Ideas some groups back */
.lede-s{max-width:44em;font-size:17px;line-height:1.55;margin:-4px 0 18px;color:#333}
.fringe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fcard{background:linear-gradient(180deg,#f7f1fb,var(--sheet) 60%);border:1px solid var(--line);border-top:4px solid var(--v4);border-radius:14px;padding:14px 18px;min-width:0}
.fcard .cl-text{font-size:17px}
.fcard .grp{font:700 12px/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--v4);margin:0 0 8px}
.cmp{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) 44px;gap:6px 10px;align-items:center;font-size:14px}
.cmp .bar{height:10px;background:var(--panel);border-radius:5px;overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:5px;background:var(--c);transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.cmp b{font-variant-numeric:tabular-nums;text-align:right}

.how{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 18px;max-width:52em}
.how summary{cursor:pointer;font:600 18px/1.3 var(--display)}
.how ul{margin:10px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.how p{margin:0 0 4px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.flow li{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.flow .n{font:600 24px/1 var(--display);color:var(--accent)}
.flow b{font:600 17px/1.25 var(--display)}
.flow span.d{font-size:15px;color:#333}
@media (max-width:900px){.fringe{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.card .res{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.summary button span{display:none}}
@media (max-width:520px){.flow{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.div .no,.div .yes,.cmp .bar i{animation:none}.summary button{transition:none}}
</style>
</head>
<body class="tp">
<header class="top wrap"><div class="in">
  <a class="brand" href="./"><p data-i18n="brand.kicker"></p><h1>public<i></i>charters</h1></a>
  <nav class="sn" aria-label="Site"><a href="participate.html" data-i18n="nav.take"></a><a href="results.html" aria-current="page" data-i18n="nav.results"></a><a href="charter.html" data-i18n="nav.charter"></a><a href="about.html" data-i18n="nav.about"></a></nav>
  <span data-langs></span>
  <div class="acct" id="acct"></div>
</div></header>

<section class="hero wrap"><div class="in">
  <h2 data-i18n-html="results.h"></h2>
  <p class="lede" data-i18n="results.lede"></p>
  <p class="statsline" id="stats"></p>
  <p class="chip-sample"><b data-i18n="common.sample"></b><span data-i18n="common.sampleNote"></span></p>
</div></section>

<main class="wrap"><div class="in">

<section class="block">
  <div class="summary" id="summary"></div>
  <div class="key" id="key" role="group"></div>
  <p class="hint" data-i18n="results.filterHint"></p>
</section>

<section class="block" id="list">
  <h3 class="sec reveal" data-i18n="results.listH"></h3>
  <p class="hint" data-i18n="results.listHint" style="margin:-6px 0 16px"></p>
  <div class="cards" id="cards"></div>
  <div class="more-row" id="more"></div>
</section>

<section class="block" id="fringe">
  <h3 class="sec reveal" data-i18n="results.fringeH"></h3>
  <p class="lede-s reveal" data-i18n="results.fringeP"></p>
  <div class="fringe" id="fringeList"></div>
</section>

<section class="block">
  <details class="how reveal">
    <summary data-i18n="results.howH"></summary>
    <ul><li data-i18n-html="results.how2"></li><li data-i18n-html="results.how3"></li><li data-i18n="results.how4"></li></ul>
    <p class="small muted" data-i18n="results.howNote"></p>
  </details>
</section>

<section class="block" id="next">
  <h3 class="sec reveal" data-i18n="results.nextH"></h3>
  <ol class="flow">
    <li class="reveal"><span class="n">1</span><b data-i18n="results.next1h"></b><span class="d" data-i18n="results.next1"></span></li>
    <li class="reveal" data-delay="100"><span class="n">2</span><b data-i18n="results.next2h"></b><span class="d" data-i18n="results.next2"></span></li>
    <li class="reveal" data-delay="200"><span class="n">3</span><b data-i18n="results.next3h"></b><span class="d" data-i18n="results.next3"></span></li>
    <li class="reveal" data-delay="300"><span class="n">4</span><b data-i18n="results.next4h"></b><span class="d" data-i18n="results.next4"></span></li>
  </ol>
</section>

</div></main>

<footer class="foot wrap"><div class="in" data-i18n-html="common.footer"></div></footer>

<script src="sample-data.js?v=20261125i"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261125i"></script>
<script src="app.js?v=20261125i"></script>
<script src="bridge.js?v=20261125i"></script>
<script src="community.js?v=20261125i"></script>
<script>
(() => {
const C = window.Community;
const $ = id => document.getElementById(id);
const { esc, pct } = C;
const KINDS = ['endorsed', 'contested', 'needs', 'weak'];
const color = k => `var(--${k})`;
let FILTER = null, SHOW_ALL = false;
const TOP = 8;   // cards shown before "Show all"

function render() {
  const me = C.me, sugs = C.suggestions();
  const answers = sugs.reduce((n, s) => n + s.s.n, 0);
  $('stats').textContent = T('results.statsLine', { p: C.SIZE + (me.consent ? 1 : 0), a: answers.toLocaleString(window.PC_LANG), c: sugs.length });

  // Summary bar + key (both filter the list)
  const count = k => sugs.filter(s => s.s.status === k).length;
  const kinds = KINDS.filter(count);
  $('summary').classList.toggle('filtered', !!FILTER);
  $('summary').innerHTML = kinds.map(k => `<button data-f="${k}" aria-pressed="${FILTER === k}" style="flex-grow:${count(k)};background:${color(k)}" title="${esc(T('status.' + k))}"><span>${count(k)}</span></button>`).join('');
  $('key').innerHTML = `<button data-f="" aria-pressed="${!FILTER}" style="--c:var(--ink)"><i></i>${esc(T('results.all'))} · ${sugs.length}</button>` +
    kinds.map(k => `<button data-f="${k}" aria-pressed="${FILTER === k}" style="--c:${color(k)}"><i></i>${esc(T('status.' + k))} · ${count(k)}</button>`).join('');

  // All changes as cards: own suggestions first, then most agreed first, "needs answers" last
  const list = sugs.filter(s => !FILTER || s.s.status === FILTER)
    .sort((a, b) => (b.own ? 1 : 0) - (a.own ? 1 : 0) || (a.s.status === 'needs') - (b.s.status === 'needs') || b.s.net - a.s.net);
  const shown = SHOW_ALL ? list : list.slice(0, TOP);
  $('cards').innerHTML = shown.map(s => {
    const t = s.s, k = t.status;
    return `<article class="card reveal" style="--c:${color(k)}">
      <div class="top"><span class="chip">${esc(T('status.' + k))}</span><span class="meta">${esc(T('common.article', { n: s.art ? s.art.n : '' }))} · ${esc(s.title)} · ${esc(s.clause)}</span>${s.own ? `<span class="mine">${esc(T('results.yours'))}</span>` : ''}</div>
      <p class="cl-text">${C.changedClause(s)}</p>
      ${s.why ? `<p class="why">${esc(s.why)}</p>` : ''}
      ${t.n ? `<div class="res"><div><div class="div"><span class="no" style="width:${(t.notShare * 100).toFixed(1)}%"></span><span class="yes" style="width:${(t.helpShare * 100).toFixed(1)}%"></span></div>
          <div class="pcts"><span>${pct(t.notShare)} ${esc(T('results.axisNo'))}</span><b>${pct(t.helpShare)} ${esc(T('results.axisYes'))}</b></div></div>
        <p class="line">${esc(T('results.line', { yes: pct(t.helpShare), partly: pct(t.someShare), no: pct(t.notShare), n: t.n }))}</p></div>
        <details class="more"><summary>${esc(T('demo.by'))}</summary>${C.breakdownHTML(s.ratings)}</details>` : ''}
      ${k === 'needs' && !s.own ? `<p style="margin:10px 0 0"><a class="btn small" href="participate.html#rate">${esc(T('results.rateIt'))} →</a></p>` : ''}
    </article>`;
  }).join('') || `<p class="hint">${esc(T('results.none'))}</p>`;
  $('more').innerHTML = list.length > TOP
    ? `<button class="btn" data-more>${esc(SHOW_ALL ? T('results.showLess') : T('results.showAll', { n: list.length }))}</button>` : '';

  // Ideas some groups back: not endorsed overall, but at least 60% yes in one group of 5 or more,
  // and at least 20 points above everyone. One card per change, its strongest group.
  const B = window.Bridge, fr = [];
  sugs.filter(s => s.s.n && s.s.status !== 'endorsed' && s.s.status !== 'needs').forEach(s => {
    let best = null;
    B.breakdown(C.DEMOGRAPHICS, s.ratings, B.tally).forEach(({ q, rows }) => rows.forEach(r => {
      const gap = r.helpShare - s.s.helpShare;
      if (r.helpShare >= 0.6 && gap >= 0.2 && (!best || gap > best.gap)) best = { q, r, gap };
    }));
    if (best) fr.push({ s, ...best });
  });
  fr.sort((a, b) => b.gap - a.gap);
  const bar = (label, t, c) => `<span>${esc(label)}</span><span class="bar"><i style="width:${(t.helpShare * 100).toFixed(1)}%;--c:${c}"></i></span><b>${pct(t.helpShare)}</b>`;
  $('fringeList').innerHTML = fr.slice(0, 6).map(({ s, q, r }) => `<article class="fcard reveal">
      <p class="grp">${esc(C.qLabel(q))}: ${esc(C.oLabel(q, r.option))} · ${esc(T('results.fringePeople', { n: r.n }))}</p>
      <p class="cl-text">${C.changedClause(s)}</p>
      <div class="cmp">${bar(C.oLabel(q, r.option), r, 'var(--v4)')}${bar(T('results.fringeAll'), s.s, 'var(--weak)')}</div>
    </article>`).join('') || `<p class="hint">${esc(T('results.fringeNone'))}</p>`;
  if (window.PCReveal) PCReveal();
}

document.addEventListener('click', ev => {
  const f = ev.target.closest('[data-f]');
  if (f) { FILTER = f.dataset.f && FILTER !== f.dataset.f ? f.dataset.f : null; SHOW_ALL = false; return render(); }
  if (ev.target.closest('[data-more]')) {
    const wasAll = SHOW_ALL; SHOW_ALL = !SHOW_ALL; render();
    if (wasAll) { const el = $('list'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    return;
  }
});
document.addEventListener('pc:proposed', render);
render();
})();
</script>
</body>
</html>
