<style>
/* Hero: text on the left, a charter sentence that cycles through suggested wordings on the right. */
.landing .hero .in{padding-block:clamp(26px,5vw,70px) clamp(30px,5vw,60px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.landing .hero h2{max-width:11em;font-size:clamp(44px,7vw,92px)}
.cta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:26px}
.cta .btn{font-size:17px;padding:11px 20px}
.cta .note{font-size:15px;color:var(--muted)}

.demo{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:22px 24px 18px;box-shadow:0 10px 30px rgba(20,20,20,.06)}
.demo .lbl{margin-bottom:10px}
.demo-cl{font:400 clamp(20px,2.2vw,25px)/1.5 var(--ui);margin:0;min-height:4.5em}
.swap{display:inline;padding:1px 4px;border-radius:5px;background:var(--panel);transition:opacity .35s ease,background-color .35s ease,color .35s ease}
.swap.alt{background:var(--pale);color:var(--accent)}
.swap.out{opacity:0}
.demo-tag{display:inline-flex;align-items:center;gap:7px;margin:14px 0 0;font:700 12px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .35s ease}
.demo-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.demo-tag.alt{color:var(--accent)}
.demo-dots{display:flex;gap:5px;margin-top:12px}
.demo-dots i{width:18px;height:3px;border-radius:2px;background:var(--panel);transition:background-color .35s ease}
.demo-dots i.on{background:var(--accent)}
.demo-cap{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:#333}

/* Sections */
.sec-h{font:600 clamp(28px,3.4vw,42px)/1.08 var(--display);letter-spacing:-.03em;margin:4px 0 20px;max-width:20em;text-wrap:balance}
.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.steps3 li{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pale);color:var(--accent)}
.ico svg{width:22px;height:22px}
.steps3 b{font:600 21px/1.2 var(--display)}
.steps3 p{margin:0;font-size:16px;line-height:1.45;color:#333}

.flowline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
.flowline li{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;padding-top:30px}
.flowline li::before{content:"";position:absolute;top:8px;left:0;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--pale)}
.flowline li::after{content:"";position:absolute;top:15px;left:26px;right:-10px;height:2px;background:var(--line)}
.flowline li:last-child::after{display:none}
.flowline .k{font:700 12px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.flowline b{font:600 19px/1.25 var(--display)}
.flowline span.d{font-size:15.5px;line-height:1.45;color:#333}


.explain{background:var(--ink);color:#fff;border-radius:20px;padding:clamp(22px,4vw,44px)}
.explain .eyebrow{color:#b9bcc0}
.explain .sec-h{color:#fff}
.e3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:34px}
.e3 div{border-top:2px solid var(--accent);padding-top:12px}
.e3 b{display:block;font:600 20px/1.25 var(--display);margin-bottom:6px}
.e3 p{margin:0;font-size:16px;line-height:1.5;color:#e4e4e4}
.who-h{font:600 24px/1.2 var(--display);margin:0 0 4px}
.who-p{margin:0 0 16px;color:#cfd1d4;font-size:16px}
.orgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.org{background:#1f1f1f;border:1px solid #333;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;text-decoration:none;color:#fff;transition:border-color .2s ease,transform .2s ease}
.org:hover{border-color:#777;transform:translateY(-2px)}
.org .by{font:700 11.5px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:#b9bcc0}
.org b{font:600 20px/1.2 var(--display)}
.org p{margin:0;font-size:15px;line-height:1.45;color:#d9d9d9}
.org .go{margin-top:auto;padding-top:6px;font-weight:700;font-size:14.5px;color:#f0b4b2}
.who-note{margin:18px 0 0;font-size:17px;line-height:1.5;max-width:40em}

/* "Learn more" inside the explainer */
.learn{margin:-14px 0 30px;border:1px solid #3a3a3a;border-radius:14px;background:#1b1b1b}
.learn summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;font:700 16px/1.35 var(--ui);color:#fff}
.learn summary::-webkit-details-marker{display:none}
.learn summary::before{content:"+";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px;flex:none;transition:transform .25s ease}
.learn[open] summary::before{content:"–"}
.learn summary:hover{color:#f0b4b2}
.learn-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 34px;padding:4px 20px 20px;animation:learnin .35s ease both}
.learn h4{font:600 19px/1.25 var(--display);color:#fff;margin:12px 0 8px}
.learn p{margin:0 0 8px;color:#e4e4e4;font-size:15.5px;line-height:1.55}
.covers{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.covers li{position:relative;padding-left:22px;color:#e4e4e4;font-size:15.5px;line-height:1.45}
.covers li::before{content:"";position:absolute;left:4px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.into{margin:0 0 10px;padding:0;list-style:none;counter-reset:i;display:flex;flex-direction:column;gap:10px}
.into li{counter-increment:i;position:relative;padding-left:38px;color:#e4e4e4;font-size:15.5px;line-height:1.45}
.into li::before{content:counter(i);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #f0b4b2;color:#f0b4b2;font:700 13px var(--ui)}
.into b{display:block;color:#fff}
.learn .apertus{border-left:3px solid var(--accent);padding-left:12px}
.learn .fine{font-size:14px;color:#b9bcc0}
@keyframes learnin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (max-width:900px){.learn-in{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.learn-in{animation:none}}

.kit{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 30px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.kit p{margin:0;max-width:40em;color:#333}
.kit h4{margin:0 0 4px}

@media (max-width:900px){
  .landing .hero .in{grid-template-columns:minmax(0,1fr)}
  .steps3,.e3,.orgs{grid-template-columns:minmax(0,1fr)}
  .flowline{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:22px}
  .flowline li:nth-child(2)::after{display:none}
  }
@media (max-width:520px){.flowline{grid-template-columns:minmax(0,1fr)}.flowline li::after{display:none}}
@media (prefers-reduced-motion:reduce){.swap,.demo-tag,.demo-dots i,.org{transition:none}.org:hover{transform:none}}
</style>

<script>
// Hero demo: clause 4.3 of the (translated) sample charter, cycling the phrase people want to change.
(() => {
  const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  const art = ARTS.find(a => a.id === 'a4'), cl = art.cl.find(c => c[0] === '4.3'), K = 'h4';
  const words = [HOTS[K].base].concat(HOTS[K].edits.map(e => e.text));
  const $ = id => document.getElementById(id);
  $('demoLbl').textContent = `${T('home.apertusDoc')} · 4.3`;
  $('demoCl').innerHTML = cl[1].map(p => typeof p === 'string' ? esc(p) : p.h === K ? '<span class="swap" id="swap"></span>' : esc(HOTS[p.h].base)).join('');
  $('demoDots').innerHTML = words.map(() => '<i></i>').join('');
  let i = 0;
  function show() {
    const alt = i > 0;
    $('swap').textContent = words[i];
    $('swap').classList.toggle('alt', alt);
    $('demoTag').textContent = alt ? T('home.demoSuggested') : T('home.demoToday');
    $('demoTag').classList.toggle('alt', alt);
    [...$('demoDots').children].forEach((d, j) => d.classList.toggle('on', j === i));
  }
  show();
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(() => {
    if (document.hidden) return;
    $('swap').classList.add('out');
    setTimeout(() => { i = (i + 1) % words.length; show(); $('swap').classList.remove('out'); }, 360);
  }, 3200);
})();
</script>
